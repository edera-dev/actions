name: 'Notify Slack'
description: 'Notify Slack'

inputs:
  webhook:
    description: 'Slack Webhook URL'
    required: true
  github-token:
    description: 'GitHub token for fetching logs'
    required: true
  create-issue:
    description: >
      File a tracking issue for the failure and link it in the Slack message. On a
      `push` run the issue is assigned to the author of the PR the head commit came
      from, unless that author is a bot or the branch was already failing before this
      run. One issue is kept open per workflow and branch; later failing runs comment
      on it. Needs `issues: write` and `pull-requests: read`.
    required: false
    default: 'false'
  issue-label:
    description: >
      Label applied to tracking issues, also how they are found again. Created in the
      repository if it does not exist.
    required: false
    default: 'ci'

runs:
  using: 'composite'
  steps:
  - name: Fetch failure log snippet
    shell: bash
    id: get_logs
    env:
      GH_TOKEN: ${{ inputs.github-token }}
      CREATE_ISSUE: ${{ inputs.create-issue }}
      ISSUE_LABEL: ${{ inputs.issue-label }}
    run: python3 ${{ github.action_path }}/action.py

  - name: Post a message in a channel
    uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
    with:
      webhook: ${{ inputs.webhook }}
      webhook-type: incoming-webhook
      payload: |
        text: "${{ steps.get_logs.outputs.slack_msg }}"
        blocks:
          - type: "section"
            text:
              type: "mrkdwn"
              text: "${{ steps.get_logs.outputs.slack_msg }}"
