name: Push Metrics
description: |
  Pushes metrics in Prometheus exposition format directly to Edera's shared
  Prometheus (infra repo, observability/1-observability) via remote_write,
  authenticated via this workflow's own GitHub Actions OIDC token - no
  stored secret. Requires `permissions: id-token: write` on the calling job.

  Each pushed sample gets its own real timestamp (now, or an explicit
  override) and is stored once - unlike a Pushgateway-backed push, nothing
  re-exposes the same value on every Prometheus scrape.

  Any repo can call this; access is proven by holding a real GitHub
  Actions OIDC token for the expected audience, not by a per-repo
  allowlist, since this endpoint accepts metrics rather than granting
  access to anything sensitive.

inputs:
  metrics:
    description: >-
      Prometheus exposition-format text to push. Mutually exclusive with
      metrics-file.
    required: false
  metrics-file:
    description: >-
      Path to a file containing Prometheus exposition-format text.
      Mutually exclusive with metrics.
    required: false
  timestamp-ms:
    description: >-
      Unix milliseconds to stamp every pushed sample with. Defaults to the
      time this action runs.
    required: false
    default: ''
  remote-write-url:
    description: 'remote_write endpoint of the push-metrics proxy.'
    required: false
    default: 'https://push-metrics-proxy.victorioushill-47ea6dae.eastus.azurecontainerapps.io/api/v1/write'
  audience:
    description: 'OIDC token audience the endpoint expects.'
    required: false
    default: 'push-metrics'

runs:
  using: composite
  steps:
    - name: install push dependencies
      shell: bash
      run: pip install --quiet "protobuf>=7,<8" python-snappy

    - name: push metrics
      shell: bash
      env:
        METRICS: ${{ inputs.metrics }}
        METRICS_FILE: ${{ inputs.metrics-file }}
        TIMESTAMP_MS: ${{ inputs.timestamp-ms }}
        REMOTE_WRITE_URL: ${{ inputs.remote-write-url }}
        AUDIENCE: ${{ inputs.audience }}
      run: python3 "${{ github.action_path }}/push.py"
