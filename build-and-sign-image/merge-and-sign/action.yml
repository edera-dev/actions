name: Merge, Sign and Attest Protect Image
description: |
  Assemble the per-platform digests that build-and-sign-image/build-single
  pushed into one manifest list, push it with its tags to every repository,
  sign it, and attest a merged CycloneDX SBOM. See version-tags.sh for which
  tags a release gets. Expects the repository checked out at checkout_ref
  with all its tags (fetch-depth: 0).

inputs:
  component:
    description: 'Component image (used for the Dockerfile stem, digest artifact names and SBOM name).'
    required: true
  multiarch:
    description: "'true' when build-single also pushed an arm64 digest."
    required: false
    default: 'false'
  repositories:
    description: |
      Newline-separated list of registry references. The first entry is the
      primary repository build-single pushed the digests to.
    required: true
  gcp_region:
    required: true
  gcp_workload_identity_provider:
    required: true
  gcp_service_account:
    required: true
  dockerfile:
    description: 'Dockerfile stem override (defaults to component).'
    required: false
    default: ''
  target:
    description: 'Build target stage.'
    required: false
    default: ''
  build_args:
    description: 'Newline-separated extra build args, as passed to build-single.'
    required: false
    default: ''
  sbom:
    description: "'true' to generate and attest a merged CycloneDX SBOM."
    required: false
    default: 'false'
  sbom_strict:
    description: "'true' to fail when the merged SBOM has zero components."
    required: false
    default: 'false'
  sbom_extra_scan_target:
    description: 'Extra Dockerfile stage to --load and syft-scan into the SBOM.'
    required: false
    default: ''
  checkout_ref:
    description: 'Ref the caller already resolved for the build.'
    required: true
  build_semver:
    description: 'Semver the caller already resolved for Cargo.toml.'
    required: true
  short_sha:
    description: 'Short SHA of the resolved ref; the primary image tag.'
    required: true

outputs:
  digest:
    description: 'Digest of the pushed manifest list.'
    value: ${{ steps.manifest.outputs.digest }}

runs:
  using: composite
  steps:
    - name: 'Update Cargo.toml version'
      shell: bash
      run: |
        ./hack/ci/update-cargo-toml-version.sh \
          '${{ inputs.build_semver }}' \
          '${{ inputs.checkout_ref }}'

    - name: 'Install cosign'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: 'Setup docker buildx'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: 'Login to ghcr'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ github.token }}'

    - name: 'Authenticate to Google Cloud'
      uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
      id: google-auth
      with:
        token_format: access_token
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: 'Login to Google Artifact Registry'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ${{ inputs.gcp_region }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.google-auth.outputs.access_token }}

    - name: 'Download per-arch digests'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v6.0.0
      with:
        # An exact match, because a wildcard also picks up digest-<component>-<suffix>-<arch> from the same run.
        pattern: digest-${{ inputs.component }}-{amd64,arm64}
        merge-multiple: true
        path: ${{ runner.temp }}/digests

    - name: 'Capture per-arch digests'
      id: digests
      shell: bash
      env:
        DIGESTS_DIR: ${{ runner.temp }}/digests
        MULTIARCH: ${{ inputs.multiarch }}
      run: |
        set -euo pipefail
        amd64_digest="$(cat "${DIGESTS_DIR}/amd64.digest")"
        : "${amd64_digest:?missing amd64 digest file}"
        echo "amd64=${amd64_digest}" >> "${GITHUB_OUTPUT}"
        if [ "${MULTIARCH}" = "true" ]; then
          arm64_digest="$(cat "${DIGESTS_DIR}/arm64.digest")"
          : "${arm64_digest:?missing arm64 digest file}"
          echo "arm64=${arm64_digest}" >> "${GITHUB_OUTPUT}"
        fi

    - name: 'Capture version tag list'
      id: version
      shell: bash
      env:
        PROTECT_VERSION: ${{ inputs.short_sha }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        "${GITHUB_ACTION_PATH}/../version-tags.sh"

    # latest=false, and no semver patterns for the moving tags: both would
    # tag any release, bypassing version-tags.sh's highest-release check.
    - name: 'Docker meta'
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ${{ inputs.repositories }}
        flavor: |
          latest=false
        tags: |
          type=ref,event=branch
          type=raw,value=${{ steps.version.outputs.protect_version }}
          type=semver,pattern={{raw}}
          type=semver,pattern={{version}}
          type=schedule,pattern=nightly
          ${{ steps.version.outputs.protect_version_tag_full_with_v }}
          ${{ steps.version.outputs.protect_version_tag_full_no_v }}
          ${{ steps.version.outputs.protect_version_tag_major_minor }}
          ${{ steps.version.outputs.protect_version_tag_major }}
          ${{ steps.version.outputs.protect_version_tag_stable }}
          ${{ steps.version.outputs.protect_version_tag_latest }}

    - name: 'Create manifest list and push tags'
      id: manifest
      shell: bash
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        TAGS: ${{ steps.meta.outputs.tags }}
        AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
        ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
        MULTIARCH: ${{ inputs.multiarch }}
      run: |
        set -euo pipefail
        primary="$(printf '%s\n' "${REPOSITORIES}" | sed '/^[[:space:]]*$/d' | head -n1 | xargs)"
        : "${primary:?empty repositories input}"
        echo "primary=${primary}" >> "${GITHUB_OUTPUT}"

        # Build-push pushed each arch to the primary repository by digest.
        # imagetools create assembles those digests into a manifest list and
        # pushes it, with the computed tag set applied, to every repository
        # at once.
        sources=( "${primary}@${AMD64_DIGEST}" )
        if [ "${MULTIARCH}" = "true" ]; then
          sources+=( "${primary}@${ARM64_DIGEST}" )
        fi

        tag_args=()
        while IFS= read -r tag; do
          tag="$(printf '%s' "${tag}" | xargs)"
          [ -n "${tag}" ] || continue
          tag_args+=( "--tag" "${tag}" )
        done <<< "${TAGS}"
        [ "${#tag_args[@]}" -gt 0 ] || { echo "::error::docker/metadata produced no tags"; exit 1; }

        for i in 1 2 3; do
          if docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"; then
            break
          fi
          [ "${i}" -eq 3 ] && exit 1
          echo "imagetools create attempt ${i} failed; retrying in 15s..."
          sleep 15
        done

        # The manifest list hash is the same across every repository, so
        # resolving it against the primary tag is enough.
        first_tag="$(printf '%s\n' "${TAGS}" | sed '/^[[:space:]]*$/d' | head -n1 | xargs)"
        digest="$(docker buildx imagetools inspect "${first_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
        : "${digest:?manifest list digest resolution failed}"
        echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

    - name: 'Cosign sign all tags'
      shell: bash
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
        DIGEST: ${{ steps.manifest.outputs.digest }}
      run: |
        set -euo pipefail
        while IFS= read -r tag; do
          tag="$(printf '%s' "${tag}" | xargs)"
          [ -n "${tag}" ] || continue
          repo="${tag%:*}"
          pullstring="${repo}@${DIGEST}"
          echo "Signing ${pullstring}"
          for i in 1 2 3 4 5; do
            cosign sign --yes "${pullstring}" && break
            echo "Attempt ${i} failed for ${pullstring}, retrying in 15s..."
            sleep 15
            [ "${i}" -eq 5 ] && exit 1
          done
        done <<< "${TAGS}"

    # Install syft directly from the authenticated release API to avoid the
    # unauthenticated install.sh path that upstream reports as flaky
    # (anchore/sbom-action#667). Bump SYFT_VERSION here to upgrade syft.
    - name: 'Install syft'
      if: inputs.sbom == 'true'
      id: syft
      shell: bash
      env:
        SYFT_VERSION: '1.49.0'
        GH_TOKEN: '${{ github.token }}'
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "::error::unsupported runner arch $(uname -m)" && exit 1 ;;
        esac
        tarball="syft_${SYFT_VERSION}_linux_${arch}.tar.gz"
        checksums="syft_${SYFT_VERSION}_checksums.txt"
        tmp="$(mktemp -d)"
        for i in 1 2 3 4 5; do
          gh release download "v${SYFT_VERSION}" \
            --repo anchore/syft \
            --pattern "${tarball}" \
            --pattern "${checksums}" \
            --dir "${tmp}" \
            --clobber && break
          echo "syft download attempt ${i} failed, retrying in 15s..."
          sleep 15
          [ "${i}" -eq 5 ] && exit 1
        done
        (cd "${tmp}" && grep " ${tarball}\$" "${checksums}" | sha256sum -c -)
        bindir="${RUNNER_TEMP}/syft-bin"
        mkdir -p "${bindir}"
        tar -xzf "${tmp}/${tarball}" -C "${bindir}" syft
        echo "${bindir}" >> "${GITHUB_PATH}"
        echo "cmd=${bindir}/syft" >> "${GITHUB_OUTPUT}"
        "${bindir}/syft" --version

    - name: 'Generate and merge SBOM for the manifest list'
      if: inputs.sbom == 'true'
      id: sbom
      shell: bash
      env:
        SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        REPOSITORIES: ${{ inputs.repositories }}
        PRIMARY_REPO: ${{ steps.manifest.outputs.primary }}
        AMD64_DIGEST: ${{ steps.digests.outputs.amd64 }}
        ARM64_DIGEST: ${{ steps.digests.outputs.arm64 }}
        MULTIARCH: ${{ inputs.multiarch }}
        PROTECT_VERSION: ${{ inputs.short_sha }}
        COMPONENT: ${{ inputs.component }}
        DOCKERFILE_NAME: ${{ inputs.dockerfile || inputs.component }}
        TARGET: ${{ inputs.target }}
        SBOM_STRICT: ${{ inputs.sbom_strict }}
        SBOM_EXTRA_SCAN_TARGET: ${{ inputs.sbom_extra_scan_target }}
        BUILD_ARGS: ${{ inputs.build_args }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        # list_bases.py expands FROM refs from the environment, so it must see the same build args.
        while IFS= read -r kv; do
          [ -z "${kv}" ] || export "${kv?}"
        done <<<"${BUILD_ARGS}"

        echo "Scanning amd64 at ${PRIMARY_REPO}@${AMD64_DIGEST}"
        "${SYFT_CMD}" "registry:${PRIMARY_REPO}@${AMD64_DIGEST}" \
          --platform linux/amd64 \
          --select-catalogers "-file" \
          -o "cyclonedx-json=amd64.cdx.json"

        if [ "${MULTIARCH}" = "true" ]; then
          echo "Scanning arm64 at ${PRIMARY_REPO}@${ARM64_DIGEST}"
          "${SYFT_CMD}" "registry:${PRIMARY_REPO}@${ARM64_DIGEST}" \
            --platform linux/arm64 \
            --select-catalogers "-file" \
            -o "cyclonedx-json=arm64.cdx.json"
          jq -s '{
            bomFormat: "CycloneDX",
            specVersion: "1.6",
            version: 1,
            components: (([ .[].components // [] ] | add) // []),
            dependencies: (([ .[].dependencies // [] ] | add) // [])
          }' amd64.cdx.json arm64.cdx.json > local.cdx.json
        else
          cp amd64.cdx.json local.cdx.json
        fi

        # 2) Enumerate the bases the target stage copies from.
        dockerfile="./images/Dockerfile.${DOCKERFILE_NAME}"
        [ -f "${dockerfile}" ] || dockerfile="./images/Containerfile.${DOCKERFILE_NAME}"
        mkdir -p bases
        python3 "${GITHUB_ACTION_PATH}/../sbom/list_bases.py" "${dockerfile}" "${TARGET}" \
          > bases.txt \
          || { echo "::warning::could not enumerate bases from ${dockerfile}"; : > bases.txt; }

        bases_found=0
        bases_with_sbom=0
        while IFS= read -r base; do
          [ -n "${base}" ] || continue
          bases_found=$((bases_found + 1))
          case "${base}" in
            *@sha256:*) pull="${base}" ;;
            *)
              d="$(docker buildx imagetools inspect "${base}" \
                    --format '{{json .Manifest}}' 2>/dev/null \
                    | jq -r '.digest // empty')"
              if [ -z "${d}" ]; then
                echo "::warning::could not resolve ${base} to a digest; skipping"
                continue
              fi
              pull="${base%:*}@${d}"
              ;;
          esac
          safe="$(printf '%s' "${base}" | tr -c 'A-Za-z0-9._-' '_')"
          if cosign download attestation "${pull}" 2>/dev/null \
              | jq -s '[.[] | (.dsseEnvelope.payload // .payload) | @base64d
                        | fromjson
                        | select(.predicateType == "https://cyclonedx.org/bom")
                        | .predicate] | .[0] // empty' \
              > "bases/${safe}.cdx.json" 2>/dev/null \
              && [ -s "bases/${safe}.cdx.json" ]; then
            bases_with_sbom=$((bases_with_sbom + 1))
            echo "  + ${base}: CycloneDX attestation merged"
          else
            rm -f "bases/${safe}.cdx.json"
            echo "::warning::no CycloneDX attestation for base ${base} (toolchain builder, or the pinned digest predates the SBOM rollout)"
          fi
        done < bases.txt

        # 2b) Extra scan when sbom_extra_scan_target is set. The merge job
        # runs on amd64, so the extra scan is amd64-only until an arm64
        # extra target is actually needed. Zone initrd is the only current
        # user and does not opt into multiarch.
        EXTRA_SBOM=""
        if [ -n "${SBOM_EXTRA_SCAN_TARGET}" ]; then
          echo "Building and scanning extra SBOM stage: ${SBOM_EXTRA_SCAN_TARGET}"
          extra_tag="sbom-extra-${COMPONENT}:scan"
          docker buildx build \
            --target "${SBOM_EXTRA_SCAN_TARGET}" \
            --load \
            --build-arg "PROTECT_VERSION=${PROTECT_VERSION}" \
            -f "${dockerfile}" \
            -t "${extra_tag}" .
          "${SYFT_CMD}" "${extra_tag}" \
            --select-catalogers "-file" \
            -o "cyclonedx-json=extra.cdx.json"
          extra_count="$(jq '(.components // []) | length' extra.cdx.json)"
          echo "  extra scan (${SBOM_EXTRA_SCAN_TARGET}): ${extra_count} components"
          EXTRA_SBOM=extra.cdx.json
        fi

        # 3) Merge local + extra + bases.
        LOCAL_SBOM=local.cdx.json EXTRA_SBOM="${EXTRA_SBOM}" BASES_DIR=bases \
          python3 "${GITHUB_ACTION_PATH}/../sbom/merge.py"

        count="$(jq '(.components // []) | length' "protect-${COMPONENT}.cdx.json")"
        echo "SBOM for ${COMPONENT}: ${count} components (${bases_with_sbom}/${bases_found} bases + local scan)"

        if [ "${count}" -eq 0 ]; then
          if [ "${SBOM_STRICT}" = "true" ]; then
            echo "::error::SBOM for ${COMPONENT} has no components and sbom_strict=true"
            exit 1
          fi
          echo "::warning::SBOM for ${COMPONENT} has no components; its bases carry no SBOM yet. Skipping attestation."
          echo "has_sbom=false" >> "${GITHUB_OUTPUT}"
        else
          echo "has_sbom=true" >> "${GITHUB_OUTPUT}"
        fi

    - name: 'Cosign attest SBOM to all registries'
      if: inputs.sbom == 'true' && steps.sbom.outputs.has_sbom == 'true'
      shell: bash
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        DIGEST: ${{ steps.manifest.outputs.digest }}
        COMPONENT: ${{ inputs.component }}
      run: |
        set -euo pipefail
        echo "${REPOSITORIES}" | while read -r repo; do
          repo="$(echo "${repo}" | xargs)"
          [ -z "${repo}" ] && continue
          pullstring="${repo}@${DIGEST}"
          echo "Attesting SBOM to ${pullstring}"
          for i in 1 2 3 4 5; do
            cosign attest --yes \
              --type cyclonedx \
              --predicate "protect-${COMPONENT}.cdx.json" \
              "${pullstring}" && break
            echo "Attempt ${i} failed for ${pullstring}, retrying in 15s..."
            sleep 15
            [ "${i}" -eq 5 ] && exit 1
          done
        done

    - name: 'Upload SBOM as workflow artifact'
      if: inputs.sbom == 'true' && steps.sbom.outputs.has_sbom == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sbom-protect-${{ inputs.component }}
        path: protect-${{ inputs.component }}.cdx.json
        if-no-files-found: error
