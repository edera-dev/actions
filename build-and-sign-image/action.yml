name: Build and Sign Image
description: |
  Build and sign images

inputs:
  protect_ref:
    description: 'Specific ref for protect to build'
    required: true
  component:
    description: 'Component image to build'
    required: true
  event:
    description: 'Event triggering this workflow, used to determine the tags'
    required: true
  repositories:
    description: 'Repositories where images are pushed'
    required: true
  gcp_workload_identity_provider:
    description: 'Google WIP to auth'
    required: true
  gcp_service_account:
    description: 'Google service account to use'
    required: true
  gcp_region:
    description: 'Google region to push images to'
    required: true
  dockerfile:
    description: 'Dockerfile name to use (defaults to component name)'
    required: false
  target:
    description: 'Build target stage to use'
    required: false
  push:
    description: 'To push or not'
    default: 'true'
  sbom:
    description: 'Generate an SBOM for the pushed image, attest, and upload as a workflow artifact'
    default: 'false'
  sbom_strict:
    description: |
      Fail the build when the merged SBOM has zero components (no coverage).
      Defaults to false during rollout so copy-only composites whose bases do
      not yet carry SBOM attestations warn-and-skip instead of breaking the
      release. Flip to true once every base image is publishing SBOMs.
    default: 'false'
  sbom_extra_scan_target:
    description: |
      Optional Dockerfile stage to additionally build (--load) and syft-scan,
      merging found components into the SBOM. Use it when the composite
      ships an artifact in a form syft cannot introspect, like zone-init packed
      inside an initrd.
    default: ''

runs:
  using: composite
  steps:
    - name: 'Install cosign'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: 'Setup docker buildx'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: 'Login to ghcr'
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ github.token }}'

    - name: 'Authenticate to Google Cloud'
      uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
      id: google-auth
      with:
        token_format: access_token
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: 'Set up Cloud SDK'
      uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db' # v3.0.1

    - name: 'Login to Google Artifact Registry'
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
      with:
        registry: ${{ inputs.gcp_region }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.google-auth.outputs.access_token }}

    # This step just captures the short commit as the protect_version. Every
    # image that is built gets a short commit tag.
    - name: 'Capture version and tag list'
      id: version
      shell: bash
      run: |
        echo "protect_version=$(git rev-parse --short=7 HEAD)" >> ${GITHUB_OUTPUT}

        # This is gross, but it detects whether we're checked out into a tag
        # and sets the version tags accordingly. This is for a case of
        # rebuilding an image from a tag. The docker metadata action only version
        # tags on the "tag" event, it doesn't version tag when we checkout a tag
        # on a workflow_dispatch
        # See https://github.com/edera-dev/protect/issues/1248
        if git describe --exact-match --tags &>/dev/null; then
          input="$(git describe --exact-match --tags)"
          if [[ "$input" =~ ^v([0-9]+)(\.([0-9]+))?(\.([0-9]+))?(-rc[0-9]+)?$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[3]}"
            patch="${BASH_REMATCH[5]}"
            candidate="${BASH_REMATCH[6]}"

            # Build version strings
            full_with_v="v${major}"
            full_no_v="${major}"

            if [[ -n "$minor" ]]; then
              full_with_v+=".${minor}"
              full_no_v+=".${minor}"
            fi

            if [[ -n "$patch" ]]; then
              full_with_v+=".${patch}"
              full_no_v+=".${patch}"
            fi

            if [[ -n "$candidate" ]]; then
              full_with_v+="${candidate}"
              full_no_v+="${candidate}"
            fi

            # Output full_with_v tag and descending specificity
            echo "protect_version_tag_full_with_v=$full_with_v" >> ${GITHUB_OUTPUT}
            echo "protect_version_tag_full_no_v=$full_no_v" >> ${GITHUB_OUTPUT}

            # Do not output broader specificity when there is a release candidate
            if [[ -z "$candidate" ]]; then
              echo "protect_version_tag_major_minor=${major}.${minor}" >> ${GITHUB_OUTPUT}
              echo "protect_version_tag_major=${major}" >> ${GITHUB_OUTPUT}
              echo "protect_version_tag_stable=stable" >> ${GITHUB_OUTPUT}
              echo "protect_version_tag_latest=latest" >> ${GITHUB_OUTPUT}
            fi
          fi
        fi

    - name: Docker meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        images: ${{ inputs.repositories }}
        tags: |
          # Tag with branch on push
          type=ref,event=branch

          # Tag with short sha on all events
          # NOTE: sha will not work here because we check out
          #       a different sha in the calling workflow and
          #       it doesn't play nice with workflow_dispatch
          #       events.
          type=raw,value=${{ steps.version.outputs.protect_version }}

          # Tag version and stable on tag push
          type=semver,pattern={{raw}}
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern=stable

          # Tag nightly on schedule event
          type=schedule,pattern=nightly

          ${{ steps.version.outputs.protect_version_tag_full_with_v }}
          ${{ steps.version.outputs.protect_version_tag_full_no_v }}
          ${{ steps.version.outputs.protect_version_tag_major_minor }}
          ${{ steps.version.outputs.protect_version_tag_major }}
          ${{ steps.version.outputs.protect_version_tag_stable }}
          ${{ steps.version.outputs.protect_version_tag_latest }}

    - name: 'Flatten image tag yaml'
      id: flattened-tags
      shell: bash
      run: echo "tags=$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ',')" >> $GITHUB_OUTPUT

    - name: 'Docker build and push protect-${{ inputs.component }}'
      uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea # v3.8.0
      id: push
      with:
        action: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with: |
          # Without setting the context, the docker action will internally
          # re-clone the repo from the Actions ref.
          # We don't want that, as it's both not necessary
          # (we should always run the checkout action explicitly before this),
          # and we want preceding Cargo.toml version munges to be respected.
          context: .
          file: ${{ hashFiles(format('./images/Dockerfile.{0}', inputs.dockerfile || inputs.component)) != '' && format('./images/Dockerfile.{0}', inputs.dockerfile || inputs.component) || format('./images/Containerfile.{0}', inputs.dockerfile || inputs.component) }}
          target: ${{ inputs.target }}
          platforms: linux/amd64
          tags: ${{ steps.flattened-tags.outputs.tags }}
          push: "${{ inputs.push }}"
          build-args: |
            PROTECT_VERSION=${{ steps.version.outputs.protect_version }}
            REGISTRY_USER=oauth2accesstoken
          secrets: |
            registry_token=${{ steps.google-auth.outputs.access_token }}
        attempt_limit: 3
        attempt_delay: 30000

    - name: 'Resolve pushed image digest'
      if: ${{ inputs.push == 'true' }}
      id: digest
      shell: bash
      run: |
        set -euo pipefail
        primary_repo="$(echo "${REPOSITORIES}" | head -n1 | xargs)"
        DIGEST="$(docker buildx imagetools inspect \
          "${primary_repo}:${PROTECT_VERSION}" \
          --format '{{json .Manifest}}' | jq -r '.digest')"
        : "${DIGEST:?could not resolve image digest}"
        echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        PROTECT_VERSION: ${{ steps.version.outputs.protect_version }}

    - name: 'Cosign sign all images'
      if: '${{ inputs.push == true }}'
      shell: bash
      run: |
        for tag in $(echo '${{ steps.meta.outputs.tags }}'); do
          pullstring="${tag}@${DIGEST}"
          echo "Signing ${pullstring}"
          for i in $(seq 1 5); do
            cosign sign --yes "${pullstring}" && break
            echo "Attempt $i failed for ${pullstring}, retrying in 15s..."
            sleep 15
            [ $i -eq 5 ] && exit 1
          done
        done
      env:
        DIGEST: '${{ steps.digest.outputs.digest }}'

    - name: 'Install syft'
      if: ${{ inputs.sbom == 'true' && inputs.push == 'true' }}
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610
      id: syft

    # Build the composite's SBOM in three parts and merge them:
    #   1. scan the pushed image itself (cargo-auditable dep trees, shipped apk
    #      rootfs, etc. -- empty for pure FROM-scratch copy-only composites);
    #   2. enumerate the bases the target stage COPYs shipped artifacts from and
    #      download each base's own CycloneDX attestation (by digest, no verify);
    #   3. merge the local scan + base SBOMs into one document.
    # Bases without an attestation (toolchain builders, or pins predating the
    # SBOM rollout) are skipped with a warning. By default an empty result warns
    # and skips attestation rather than failing the release; set sbom_strict to
    # flip empty -> hard failure once every base is publishing SBOMs.
    - name: 'Generate and merge SBOM for pushed image'
      if: ${{ inputs.sbom == 'true' && inputs.push == 'true' }}
      id: sbom
      shell: bash
      run: |
        set -euo pipefail
        primary_repo="$(echo "${REPOSITORIES}" | head -n1 | xargs)"

        # wretry.action does not pass through inner action outputs, so
        # resolve the digest from the registry via the short-sha tag
        if [ -z "${DIGEST}" ]; then
          DIGEST="$(docker buildx imagetools inspect \
            "${primary_repo}:${PROTECT_VERSION}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
        fi
        : "${DIGEST:?could not resolve image digest}"
        echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"

        # 1) Scan the pushed composite image itself. Drop per-file noise; keep
        #    package + binary (cargo-auditable) catalogers. Zero components is
        #    expected for pure copy-only composites and is not an error here.
        echo "Scanning ${primary_repo}@${DIGEST}"
        "${SYFT_CMD}" "registry:${primary_repo}@${DIGEST}" \
          --select-catalogers "-file" \
          -o "cyclonedx-json=local.cdx.json"

        # 2) Enumerate the bases this composite copies from and pull each base's
        #    CycloneDX attestation, keyed by an immutable digest.
        dockerfile="./images/Dockerfile.${DOCKERFILE_NAME}"
        [ -f "${dockerfile}" ] || dockerfile="./images/Containerfile.${DOCKERFILE_NAME}"
        mkdir -p bases
        python3 "${GITHUB_ACTION_PATH}/sbom/list_bases.py" "${dockerfile}" "${TARGET}" \
          > bases.txt \
          || { echo "::warning::could not enumerate bases from ${dockerfile}"; : > bases.txt; }

        bases_found=0
        bases_with_sbom=0
        while IFS= read -r base; do
          [ -n "${base}" ] || continue
          bases_found=$((bases_found + 1))
          case "${base}" in
            *@sha256:*) pull="${base}" ;;
            *)
              d="$(docker buildx imagetools inspect "${base}" \
                    --format '{{json .Manifest}}' 2>/dev/null \
                    | jq -r '.digest // empty')"
              if [ -z "${d}" ]; then
                echo "::warning::could not resolve ${base} to a digest; skipping"
                continue
              fi
              pull="${base%:*}@${d}"
              ;;
          esac
          safe="$(printf '%s' "${base}" | tr -c 'A-Za-z0-9._-' '_')"
          # Download attestations and extract the first CycloneDX predicate.
          # Handles both the bundle (.dsseEnvelope.payload) and bare DSSE shapes.
          if cosign download attestation "${pull}" 2>/dev/null \
              | jq -s '[.[] | (.dsseEnvelope.payload // .payload) | @base64d
                        | fromjson
                        | select(.predicateType == "https://cyclonedx.org/bom")
                        | .predicate] | .[0] // empty' \
              > "bases/${safe}.cdx.json" 2>/dev/null \
              && [ -s "bases/${safe}.cdx.json" ]; then
            bases_with_sbom=$((bases_with_sbom + 1))
            echo "  + ${base}: CycloneDX attestation merged"
          else
            rm -f "bases/${safe}.cdx.json"
            echo "::warning::no CycloneDX attestation for base ${base} (toolchain builder, or pinned digest predates SBOM rollout -- bump the FROM pin to an SBOM-bearing digest)"
          fi
        done < bases.txt

        # 2b) Extra scan when `sbom_extra_scan_target` is set.
        EXTRA_SBOM=""
        if [ -n "${SBOM_EXTRA_SCAN_TARGET}" ]; then
          echo "Building + scanning extra SBOM stage: ${SBOM_EXTRA_SCAN_TARGET}"
          extra_tag="sbom-extra-${COMPONENT}:scan"
          docker buildx build \
            --target "${SBOM_EXTRA_SCAN_TARGET}" \
            --load \
            --build-arg "PROTECT_VERSION=${PROTECT_VERSION}" \
            -f "${dockerfile}" \
            -t "${extra_tag}" .
          "${SYFT_CMD}" "${extra_tag}" \
            --select-catalogers "-file" \
            -o "cyclonedx-json=extra.cdx.json"
          extra_count="$(jq '(.components // []) | length' extra.cdx.json)"
          echo "  extra scan (${SBOM_EXTRA_SCAN_TARGET}): ${extra_count} components"
          EXTRA_SBOM=extra.cdx.json
        fi

        # 3) Merge local scan + extra scan + base SBOMs into protect-${COMPONENT}.cdx.json.
        LOCAL_SBOM=local.cdx.json EXTRA_SBOM="${EXTRA_SBOM}" BASES_DIR=bases \
          python3 "${GITHUB_ACTION_PATH}/sbom/merge.py"

        count="$(jq '(.components // []) | length' "protect-${COMPONENT}.cdx.json")"
        echo "SBOM for ${COMPONENT}: ${count} components (${bases_with_sbom}/${bases_found} bases + local scan)"

        if [ "${count}" -eq 0 ]; then
          if [ "${SBOM_STRICT}" = "true" ]; then
            echo "::error::SBOM for ${COMPONENT} has no components and sbom_strict=true"
            exit 1
          fi
          echo "::warning::SBOM for ${COMPONENT} has no components; its bases carry no SBOM yet. Skipping attestation. Set sbom_strict=true to fail instead once the SBOM rollout is complete."
          echo "has_sbom=false" >> "${GITHUB_OUTPUT}"
        else
          echo "has_sbom=true" >> "${GITHUB_OUTPUT}"
        fi
      env:
        SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        REPOSITORIES: ${{ inputs.repositories }}
        DIGEST: ${{ steps.push.outputs.digest }}
        PROTECT_VERSION: ${{ steps.version.outputs.protect_version }}
        COMPONENT: ${{ inputs.component }}
        DOCKERFILE_NAME: ${{ inputs.dockerfile || inputs.component }}
        TARGET: ${{ inputs.target }}
        SBOM_STRICT: ${{ inputs.sbom_strict }}
        SBOM_EXTRA_SCAN_TARGET: ${{ inputs.sbom_extra_scan_target }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}

    - name: 'Cosign attest SBOM to all registries'
      if: ${{ inputs.sbom == 'true' && inputs.push == 'true' && steps.sbom.outputs.has_sbom == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # One attestation per repository@digest
        echo "${REPOSITORIES}" | while read -r repo; do
          repo="$(echo "${repo}" | xargs)"
          [ -z "${repo}" ] && continue
          pullstring="${repo}@${DIGEST}"
          echo "Attesting SBOM to ${pullstring}"
          for i in $(seq 1 5); do
            cosign attest --yes \
              --type cyclonedx \
              --predicate "protect-${COMPONENT}.cdx.json" \
              "${pullstring}" && break
            echo "Attempt $i failed for ${pullstring}, retrying in 15s..."
            sleep 15
            [ $i -eq 5 ] && exit 1
          done
        done
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        DIGEST: ${{ steps.sbom.outputs.digest }}
        COMPONENT: ${{ inputs.component }}

    - name: 'Upload SBOM as workflow artifact'
      if: ${{ inputs.sbom == 'true' && inputs.push == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: sbom-protect-${{ inputs.component }}
        path: protect-${{ inputs.component }}.cdx.json
        if-no-files-found: error
