name: Build Protect Image (Single Platform)
description: |
  Build one platform's protect-<component> image and push it to the primary
  repository by digest only (no tag), on the runner the caller picked for
  that platform. build-and-sign-image/merge-and-sign then assembles the
  digests into a manifest list, tags, signs and attests it. Expects the
  repository checked out at checkout_ref.

inputs:
  component:
    description: 'Component image to build (used for Dockerfile stem and artifact name).'
    required: true
  arch:
    description: 'Short arch label used in the digest artifact name (amd64 or arm64).'
    required: true
  docker_platform:
    description: 'Docker platform value (linux/amd64 or linux/arm64).'
    required: true
  dockerfile:
    description: 'Dockerfile stem override (defaults to component).'
    required: false
    default: ''
  target:
    description: 'Build target stage.'
    required: false
    default: ''
  build_args:
    description: 'Newline-separated extra build args, appended to the defaults.'
    required: false
    default: ''
  checkout_ref:
    description: 'Ref the caller already resolved for the build.'
    required: true
  build_semver:
    description: 'Semver the caller already resolved for Cargo.toml.'
    required: true
  short_sha:
    description: 'Short SHA of the resolved ref, passed to the build as PROTECT_VERSION.'
    required: true
  repositories:
    description: |
      Newline-separated list of registry references. The first entry is the primary
      repository the digest is pushed to for later manifest-list assembly. The merge
      job mirrors the final manifest list to every entry.
    required: true
  gcp_region:
    required: true
  gcp_workload_identity_provider:
    required: true
  gcp_service_account:
    required: true

runs:
  using: composite
  steps:
    - name: 'report disk space (before)'
      uses: edera-dev/actions/report-disk-space@6e6996f6fff5d6016bcdc097e9065da6fb33ac7f # v0.0.17

    - name: 'reclaim runner disk space'
      uses: edera-dev/actions/reclaim-disk-space@6e6996f6fff5d6016bcdc097e9065da6fb33ac7f # v0.0.17

    - name: 'Update Cargo.toml version'
      shell: bash
      run: |
        ./hack/ci/update-cargo-toml-version.sh \
          '${{ inputs.build_semver }}' \
          '${{ inputs.checkout_ref }}'

    - name: 'Setup docker buildx'
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: 'Login to ghcr'
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
      with:
        registry: ghcr.io
        username: '${{ github.actor }}'
        password: '${{ github.token }}'

    - name: 'Authenticate to Google Cloud'
      uses: step-security/google-github-auth@775fc4c80760272ef389c9f9f8d98de7db0c170d # v3.0.2
      id: google-auth
      with:
        token_format: access_token
        workload_identity_provider: ${{ inputs.gcp_workload_identity_provider }}
        service_account: ${{ inputs.gcp_service_account }}

    - name: 'Login to Google Artifact Registry'
      uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
      with:
        registry: ${{ inputs.gcp_region }}-docker.pkg.dev
        username: oauth2accesstoken
        password: ${{ steps.google-auth.outputs.access_token }}

    - name: 'Resolve primary repository and Dockerfile path'
      id: resolve
      shell: bash
      env:
        REPOSITORIES: ${{ inputs.repositories }}
        DOCKERFILE_NAME: ${{ inputs.dockerfile || inputs.component }}
      run: |
        set -euo pipefail
        primary="$(printf '%s\n' "${REPOSITORIES}" | sed '/^[[:space:]]*$/d' | head -n1 | xargs)"
        [ -n "${primary}" ] || { echo "::error::empty repositories input"; exit 1; }
        echo "primary=${primary}" >> "${GITHUB_OUTPUT}"
        path="./images/Dockerfile.${DOCKERFILE_NAME}"
        [ -f "${path}" ] || path="./images/Containerfile.${DOCKERFILE_NAME}"
        echo "dockerfile=${path}" >> "${GITHUB_OUTPUT}"

    - name: 'Docker build and push ${{ inputs.arch }} by digest'
      id: build
      continue-on-error: true
      uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
      with:
        context: .
        file: ${{ steps.resolve.outputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.docker_platform }}
        outputs: type=image,name=${{ steps.resolve.outputs.primary }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          PROTECT_VERSION=${{ inputs.short_sha }}
          REGISTRY_USER=oauth2accesstoken
          ${{ inputs.build_args }}
        secrets: |
          registry_token=${{ steps.google-auth.outputs.access_token }}

    - name: 'Wait before retrying build'
      if: steps.build.outcome == 'failure'
      shell: sh
      run: sleep 15

    - name: 'Docker build and push ${{ inputs.arch }} by digest (retry 1)'
      id: build_retry
      continue-on-error: true
      if: steps.build.outcome == 'failure'
      uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
      with:
        context: .
        file: ${{ steps.resolve.outputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.docker_platform }}
        outputs: type=image,name=${{ steps.resolve.outputs.primary }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          PROTECT_VERSION=${{ inputs.short_sha }}
          REGISTRY_USER=oauth2accesstoken
          ${{ inputs.build_args }}
        secrets: |
          registry_token=${{ steps.google-auth.outputs.access_token }}

    - name: 'Wait before retrying build again'
      if: steps.build_retry.outcome == 'failure'
      shell: sh
      run: sleep 15

    - name: 'Docker build and push ${{ inputs.arch }} by digest (retry 2)'
      id: build_retry2
      if: steps.build_retry.outcome == 'failure'
      uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
      with:
        context: .
        file: ${{ steps.resolve.outputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.docker_platform }}
        outputs: type=image,name=${{ steps.resolve.outputs.primary }},push-by-digest=true,name-canonical=true,push=true
        build-args: |
          PROTECT_VERSION=${{ inputs.short_sha }}
          REGISTRY_USER=oauth2accesstoken
          ${{ inputs.build_args }}
        secrets: |
          registry_token=${{ steps.google-auth.outputs.access_token }}

    - name: 'Record digest for the merge job'
      shell: bash
      env:
        DIGEST: ${{ steps.build_retry2.outputs.digest || steps.build_retry.outputs.digest || steps.build.outputs.digest }}
        ARCH: ${{ inputs.arch }}
      run: |
        set -euo pipefail
        : "${DIGEST:?build-push-action returned an empty digest}"
        mkdir -p "${RUNNER_TEMP}/digests"
        printf '%s\n' "${DIGEST}" > "${RUNNER_TEMP}/digests/${ARCH}.digest"

    - name: 'Upload digest artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: digest-${{ inputs.component }}-${{ inputs.arch }}
        path: ${{ runner.temp }}/digests/${{ inputs.arch }}.digest
        if-no-files-found: error
        retention-days: 1

    - name: 'report disk space (after)'
      if: always()
      uses: edera-dev/actions/report-disk-space@6e6996f6fff5d6016bcdc097e9065da6fb33ac7f # v0.0.17
